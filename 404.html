<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Sajal Baiddya</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B0B; --text:#F2F5F3; --text-muted:#9BA3A8;
    --neon-green:#3DFFB0; --sky-blue:#4FD8FF; --accent-red:#FF3B5C;
    --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  }
  *{ box-sizing:border-box; }
  html{ overflow-x:hidden; max-width:100%; overscroll-behavior-x:none; }
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:var(--font-body);
    display:flex; align-items:center; justify-content:center; text-align:center; padding:2rem;
    overflow:hidden; max-width:100%; overscroll-behavior-x:none; position:relative;
  }
  body::before{
    content:''; position:absolute; inset:-20%; z-index:0;
    background:radial-gradient(circle at 30% 30%, rgba(61,255,176,.12), transparent 45%),
               radial-gradient(circle at 75% 70%, rgba(79,216,255,.1), transparent 45%);
  }
  .wrap{ position:relative; z-index:1; max-width:560px; }
  .glitch{
    font-family:var(--font-mono); font-size:clamp(4rem,14vw,7rem); font-weight:700; margin:0;
    color:var(--neon-green); text-shadow:0 0 24px rgba(61,255,176,.5);
    animation: glitch 2.4s infinite;
  }
  @keyframes glitch{
    0%,100%{ transform:translate(0,0); }
    92%{ transform:translate(0,0); }
    93%{ transform:translate(-3px,2px); color:var(--sky-blue); }
    94%{ transform:translate(3px,-2px); color:var(--accent-red); }
    95%{ transform:translate(0,0); color:var(--neon-green); }
  }
  .bug{ font-size:3rem; margin:0 0 1rem; }
  h1.title{ font-family:var(--font-display); font-size:1.5rem; margin:1rem 0 .5rem; }
  p{ color:var(--text-muted); margin-bottom:2rem; }
  .terminal{
    text-align:left; font-family:var(--font-mono); font-size:.85rem; background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:1rem 1.2rem; margin-bottom:2rem;
    backdrop-filter:blur(12px); color:var(--text-muted);
  }
  .terminal span{ color:var(--sky-blue); }
  .btn{
    display:inline-flex; align-items:center; gap:.5rem; padding:.9rem 1.8rem; border-radius:99px;
    background:linear-gradient(135deg,var(--neon-green),var(--sky-blue)); color:#03150d; font-weight:600;
    text-decoration:none; transition:transform .2s ease, box-shadow .2s ease;
  }
  .btn:hover{ transform:translateY(-3px); box-shadow:0 0 24px rgba(61,255,176,.4); }
  @media (prefers-reduced-motion: reduce){ .glitch{ animation:none; } }
</style>
</head>
<body>
  <div class="wrap">
    <p class="bug" aria-hidden="true">🐛</p>
    <h1 class="glitch">404</h1>
    <h2 class="title">This route wasn't found in production.</h2>
    <p>Looks like this page wandered off and forgot to <code>git commit</code>.</p>
    <div class="terminal">
      <span>rafael@dev</span>:~$ curl this-page<br>
      Error: 404 Not Found — the requested resource does not exist.<br>
      <span>rafael@dev</span>:~$ cd ~/home
    </div>
    <a href="index.html" class="btn">← Back Home</a>
  </div>
</body>
</html>
